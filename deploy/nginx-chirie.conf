# /etc/nginx/sites-available/chirie — Mini App reverse proxy.
# After DNS A record points to the VPS:  certbot --nginx -d imobil.DOMEN.md
server {
    listen 80;
    server_name imobil.REPLACE_ME.md;   # <-- replace with your domain

    location /photos/ {
        alias /opt/imobiliare/data/photos/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
